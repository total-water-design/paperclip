name: Mobile Foundation CI

on:
  push:
    branches: [mobile-foundation, mobile-app-enforcement]
  pull_request:
    branches: [alpha]

permissions:
  contents: read

jobs:
  mobile-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mobile contract validation dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Validate mobile/PWA and enforcement isolation
        run: |
          python -m pytest -q tests/test_mobile*.py
          python -m py_compile mobile_access.py
