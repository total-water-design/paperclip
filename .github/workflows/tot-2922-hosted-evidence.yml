name: TOT-2922 hosted evidence

on:
  push:
    branches:
      - "task/**"
    paths:
      - ".github/workflows/tot-2922-hosted-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-evidence:
    # This is a disposable GitHub-hosted runner; it has no production routes or data.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_ROOT: /var/lib/paperclip/staging/TOT-2922-a7d87139
      EVIDENCE_DIR: ${{ github.workspace }}/tot-2922-raw-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a7d871390ac7ce9a4843184a98b7198ac690b774

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Establish pinned package manager
        shell: bash
        run: |
          set -euo pipefail
          export COREPACK_HOME="${RUNNER_TEMP:?}/tot-2922-corepack"
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          test "$(pnpm --version)" = "9.15.4"

      - name: Capture preconditions and canonical empty staging root
        shell: bash
        run: |
          set -uo pipefail
          export COREPACK_HOME="${RUNNER_TEMP:?}/tot-2922-corepack"
          mkdir -p "$EVIDENCE_DIR"
          : > "$EVIDENCE_DIR/preconditions.raw.txt"
          # Hosted runners start as the unprivileged `runner` account.  The
          # bounded packet itself is deliberately executed through the
          # runner's passwordless sudo capability so its recorded operator
          # identity is exactly root:root; no host service or route is used.
          root_env=(sudo -n env "PATH=$PATH" "COREPACK_HOME=$COREPACK_HOME")
          failed=0
          record() {
            printf '\n=== %s ===\n' "$1" | tee -a "$EVIDENCE_DIR/preconditions.raw.txt"
            shift
            "$@" >> "$EVIDENCE_DIR/preconditions.raw.txt" 2>&1
            status=$?
            printf 'exit=%s\n' "$status" | tee -a "$EVIDENCE_DIR/preconditions.raw.txt"
            test "$status" -eq 0 || failed=1
          }
          record identity "${root_env[@]}" bash -c 'id; test "$(id -u)" = 0; test "$(id -g)" = 0'
          record no-new-privs "${root_env[@]}" grep '^NoNewPrivs:[[:space:]]*0$' /proc/self/status
          record pid-proc "${root_env[@]}" bash -c 'test "$$" -eq "$(awk "{print \$1}" /proc/$$/stat)"; test -r "/proc/$$/status"'
          record node "${root_env[@]}" bash -c 'node --version; test "$(node --version | cut -d. -f1)" = v24'
          record pnpm "${root_env[@]}" bash -c 'pnpm --version; test "$(pnpm --version)" = 9.15.4'
          record visudo-version "${root_env[@]}" bash -c 'actual="$(visudo -V | awk "/^Sudo version / {print \$3; exit}")"; printf "visudo=%s\\n" "$actual"; dpkg --compare-versions "$actual" ge 1.9.15p5'
          record staging-root "${root_env[@]}" bash -c 'test ! -e "$1" && install -d -o 0 -g 0 -m 0700 "$1" && realpath "$1" && stat -c "%n uid=%u gid=%g mode=%a type=%F" "$1" && ls -ladn "$1" && find "$1" -xdev -printf "%p uid=%u gid=%g mode=%m type=%y\\n" && test -z "$(find "$1" -mindepth 1 -print -quit)"' _ "$STAGING_ROOT"
          {
            printf '## TOT-2922 preconditions (raw)\n\n```text\n'
            cat "$EVIDENCE_DIR/preconditions.raw.txt"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if test "$failed" -ne 0; then
            # The Actions artifact is the canonical full packet.  Repeat the
            # small precondition transcript in a check annotation too, so
            # read-only GitHub API access can identify an exact failed gate
            # even when the artifact-storage redirect is unavailable.
            compact="$(tr '\n' '|' < "$EVIDENCE_DIR/preconditions.raw.txt")"
            printf '::error title=TOT-2922 preconditions raw::%s\n' "$compact"
          fi
          exit "$failed"

      - name: Install immutable tree dependencies
        shell: bash
        run: |
          set -euo pipefail
          export COREPACK_HOME="${RUNNER_TEMP:?}/tot-2922-corepack"
          pnpm install --frozen-lockfile

      - name: Run seven hot-restart continuity cases
        shell: bash
        run: |
          set -euo pipefail
          export COREPACK_HOME="${RUNNER_TEMP:?}/tot-2922-corepack"
          cases=(
            'captures a hot-restart shutdown snapshot without interrupting running runs'
            'snapshots and drains a server-stdio ACP run before embedded database shutdown'
            'reports a selectively drained ACP run as lost when terminal persistence fails'
            'drains only server-stdio runs and preserves detached CLI adoption in a mixed restart'
            'adopts an old-server legacy snapshot written for a new instance-scoped marker'
            'reports preflight live runs as lost when the shutdown snapshot is missing'
            'reports a preflight run that finished before snapshot capture as finalized'
          )
          : > "$EVIDENCE_DIR/hot-restart-cases.raw.txt"
          for case_name in "${cases[@]}"; do
            printf '\n=== %s ===\n' "$case_name" | tee -a "$EVIDENCE_DIR/hot-restart-cases.raw.txt"
            sudo -n env "PATH=$PATH" "COREPACK_HOME=$COREPACK_HOME" pnpm exec vitest run server/src/__tests__/heartbeat-process-recovery.test.ts \
              -t "$case_name" --reporter=verbose 2>&1 | tee -a "$EVIDENCE_DIR/hot-restart-cases.raw.txt"
          done
          # Preserve the exact asserted classifications and raw test output together.
          sed -n '1452,1901p' server/src/__tests__/heartbeat-process-recovery.test.ts \
            > "$EVIDENCE_DIR/hot-restart-classifications.source.txt"
          grep -E 'adoptedRunIds|finalizedWhileDownRunIds|lostRunIds' \
            "$EVIDENCE_DIR/hot-restart-classifications.source.txt" \
            | tee "$EVIDENCE_DIR/hot-restart-classifications.raw.txt"
          for classification in adoptedRunIds finalizedWhileDownRunIds lostRunIds; do
            grep -q "$classification" "$EVIDENCE_DIR/hot-restart-classifications.raw.txt"
          done

      - name: Validate real sudoers grammar without installation
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env "PATH=$PATH" visudo -c -f deploy/recovery/paperclip-recovery 2>&1 \
            | tee "$EVIDENCE_DIR/visudo.raw.txt"

      - name: Assert staging root stayed empty and remove it
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -e "$STAGING_ROOT"; then
            sudo -n env "STAGING_ROOT=$STAGING_ROOT" bash -c '
              realpath "$STAGING_ROOT"
              stat -c "%n uid=%u gid=%g mode=%a type=%F" "$STAGING_ROOT"
              ls -ladn "$STAGING_ROOT"
              find "$STAGING_ROOT" -xdev -printf "%p uid=%u gid=%g mode=%m type=%y\\n"
              test -z "$(find "$STAGING_ROOT" -mindepth 1 -print -quit)"
              rmdir "$STAGING_ROOT"
            ' | tee "$EVIDENCE_DIR/staging-final.raw.txt"
          else
            printf 'staging root was not created; no rollback attempted\n' | tee "$EVIDENCE_DIR/staging-final.raw.txt"
          fi

      - name: Upload immutable raw evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tot-2922-a7d87139-raw-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
