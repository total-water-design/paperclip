name: Apply Advanced Weak-Species Chemistry Once

on:
  push:
    branches:
      - alpha
    paths:
      - .github/workflows/apply-advanced-weak-species-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout alpha
        uses: actions/checkout@v5
        with:
          ref: alpha
          fetch-depth: 0

      - name: Apply coupled weak-species chemistry upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def replace_between(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker not found')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:start] + replacement + text[end:]

          chem_path = Path('chemistry_analysis.py')
          chem = chem_path.read_text(encoding='utf-8')

          old_ammonia = """    # Ammonium: NH4+ <-> H+ + NH3\n    kn=10**_logk('KN',temp_c); ntot=m['ammonium']; den=h+kn\n    out['ammonia']={'total':ntot,'NH4+':ntot*h/den,'NH3':ntot*kn/den}\n"""
          new_ammonia = """    # Ammonium: NH4+ <-> H+ + NH3. pH is hydrogen-ion ACTIVITY,\n    # so use a Davies monovalent activity correction for NH4+ rather than\n    # treating 10^-pH as a free-proton molality. Neutral NH3 uses gamma ~= 1.\n    kn=10**_logk('KN',temp_c); ntot=m['ammonium']\n    ionic_strength=.5*sum(m[k]*SPECIES[k][3]**2 for k in SPECIES if SPECIES[k][3])\n    gamma_nh4=max(_davies_gamma(1,ionic_strength),1e-30)\n    ratio_nh3_nh4=kn*gamma_nh4/max(h,1e-30)\n    nh4=ntot/max(1.0+ratio_nh3_nh4,1e-30); nh3=max(0.0,ntot-nh4)\n    out['ammonia']={'total':ntot,'NH4+':nh4,'NH3':nh3,\n                    'gamma_NH4+':gamma_nh4,'neutral_fraction':nh3/max(ntot,1e-30)}\n"""
          chem = replace_once(chem, old_ammonia, new_ammonia, 'activity-aware ammonia speciation')

          helper_anchor = """    out['fluoride']={'total':ftot,'HF':ftot*h/den,'F-':ftot*khf/den}\n    return out\n\ndef _pitzer_B(beta0,beta1,beta2,alpha1,alpha2,sqrtI):\n"""
          helper_block = """    out['fluoride']={'total':ftot,'HF':ftot*h/den,'F-':ftot*khf/den}\n    return out\n\n\nHYDROXO_COMPONENTS = {\n    'sodium': ('Na', 'NaOH(aq)'),\n    'potassium': ('K', 'KOH(aq)'),\n    'calcium': ('Ca', 'CaOH+'),\n    'magnesium': ('Mg', 'MgOH+'),\n    'strontium': ('Sr', 'SrOH+'),\n    'barium': ('Ba', 'BaOH+'),\n    'iron_ii': ('Fe', 'FeOH+'),\n    'manganese_ii': ('Mn', 'MnOH+'),\n}\nNH3_MW = 17.03052\nNH4_EQ_MW = SPECIES['ammonium'][2]\n\n\ndef metal_hydroxo_speciation(comp: Mapping[str,float], temp_c: float, ph: float) -> dict:\n    \"\"\"Partition existing metal totals into free ion + first hydroxo complex.\n\n    The workbook constants use M^z+ + H2O = MOH^(z-1)+ + H+.  pH supplies\n    hydrogen activity; Davies gammas provide a transparent activity correction.\n    Only hydrolysis constants already present in the model are used.\n    \"\"\"\n    c=normalize_composition(comp); m=_molalities(c,temp_c)\n    I=.5*sum(m[k]*SPECIES[k][3]**2 for k in SPECIES if SPECIES[k][3])\n    a_h=max(10.0**(-float(ph)),1e-30); out={}\n    for key,(symbol,label) in HYDROXO_COMPONENTS.items():\n        total=max(0.0,float(m.get(key,0.0))); z=int(SPECIES[key][3])\n        k=10.0**HYDRO_LOGK[symbol]\n        product_z=z-1\n        gamma_m=max(_davies_gamma(z,I),1e-30)\n        gamma_moh=1.0 if product_z==0 else max(_davies_gamma(product_z,I),1e-30)\n        ratio=k*gamma_m/max(gamma_moh*a_h,1e-30)\n        free=total/max(1.0+ratio,1e-30); hydroxo=max(0.0,total-free)\n        out[key]={'label':label,'total_mol_kg':total,'free_mol_kg':free,\n                  'hydroxo_mol_kg':hydroxo,'free_charge':z,'hydroxo_charge':product_z,\n                  'hydrolyzed_fraction':hydroxo/max(total,1e-30),\n                  'logK_hydrolysis':HYDRO_LOGK[symbol]}\n    return out\n\n\ndef ammonia_membrane_transport(comp: Mapping[str,float], temp_c: float, ph: float,\n                                ionic_rejection: float, neutral_rejection: float=0.0) -> dict:\n    \"\"\"Transport NH4+ and neutral NH3 separately on a total-ammonia basis.\n\n    ``ammonium`` input/output remains mg/L as NH4-equivalent for compatibility.\n    NH4+ follows ionic rejection. Neutral NH3 has an independent rejection; the\n    default is zero rejection unless a membrane-specific neutral value is supplied.\n    \"\"\"\n    ri=min(max(float(ionic_rejection),0.0),0.999999999)\n    rn=min(max(float(neutral_rejection),0.0),0.999999999)\n    c=normalize_composition(comp); weak=weak_species_speciation(c,temp_c,ph)\n    amm=weak.get('ammonia',{}); kgw=_kg_water_per_l(c,temp_c)\n    nh4_l=max(0.0,float(amm.get('NH4+',0.0)))*kgw\n    nh3_l=max(0.0,float(amm.get('NH3',0.0)))*kgw\n    p_nh4=nh4_l*(1.0-ri); p_nh3=nh3_l*(1.0-rn); p_total=p_nh4+p_nh3\n    return {\n        'surface_ph':float(ph),'ionic_nh4_rejection':ri,'neutral_nh3_rejection':rn,\n        'feed_total_ammonia_mg_l_as_nh4':float(c.get('ammonium',0.0)),\n        'feed_nh4_mg_l_as_nh4':nh4_l*NH4_EQ_MW*1000.0,\n        'feed_nh3_mg_l_as_nh3':nh3_l*NH3_MW*1000.0,\n        'feed_nh3_fraction':nh3_l/max(nh4_l+nh3_l,1e-30),\n        'permeate_nh4_mg_l_as_nh4':p_nh4*NH4_EQ_MW*1000.0,\n        'permeate_nh3_mg_l_as_nh3':p_nh3*NH3_MW*1000.0,\n        'permeate_total_ammonia_mg_l_as_nh4':p_total*NH4_EQ_MW*1000.0,\n        'transport_basis':'NH4+ ionic passage + independent neutral NH3 passage',\n    }\n\n\ndef _pitzer_B(beta0,beta1,beta2,alpha1,alpha2,sqrtI):\n"""
          chem = replace_once(chem, helper_anchor, helper_block, 'hydroxo/ammonia helper insertion')

          old_ta = """    weak = weak_species_speciation(base, temp_c, ph)\n    borate = float(weak.get('boron', {}).get('B(OH)4-', 0.0))\n    phosphate_alk = _phosphate_alkalinity(weak)\n    ta_other = borate + oh - h + phosphate_alk\n    ta = hco3 + 2.0*co3 + ta_other\n"""
          new_ta = """    weak = weak_species_speciation(base, temp_c, ph)\n    hydroxo = metal_hydroxo_speciation(base, temp_c, ph)\n    borate = float(weak.get('boron', {}).get('B(OH)4-', 0.0))\n    phosphate_alk = _phosphate_alkalinity(weak)\n    ammonia_alk = float(weak.get('ammonia', {}).get('NH3', 0.0))\n    silica = weak.get('silica', {})\n    silicate_alk = float(silica.get('H3SiO4-',0.0)) + 2.0*float(silica.get('H2SiO4--',0.0))\n    fluoride_alk = float(weak.get('fluoride', {}).get('F-', 0.0))\n    hydrolysis_alk = sum(float(x.get('hydroxo_mol_kg',0.0)) for x in hydroxo.values())\n    alk_components = {\n        'borate':borate,'phosphate':phosphate_alk,'ammonia_nh3':ammonia_alk,\n        'silicate':silicate_alk,'fluoride':fluoride_alk,'metal_hydrolysis':hydrolysis_alk,\n        'hydroxide':oh,'hydrogen':-h,\n    }\n    ta_other = sum(alk_components.values())\n    ta = hco3 + 2.0*co3 + ta_other\n"""
          chem = replace_once(chem, old_ta, new_ta, 'expanded noncarbonate alkalinity')

          old_return_tail = """        'a_hco3': hco3*float(pg.get('HCO3', 1.0)),\n        'a_co3': co3*float(pg.get('CO3', 1.0)),\n        'pitzer': pit, 'weak_systems': weak, 'composition': comp_eq,\n    }\n\n\ndef solve_carbonate_state"""
          new_return_tail = """        'a_hco3': hco3*float(pg.get('HCO3', 1.0)),\n        'a_co3': co3*float(pg.get('CO3', 1.0)),\n        'ammonia_total_mol_kg':float(weak.get('ammonia',{}).get('total',0.0)),\n        'nh4_mol_kg':float(weak.get('ammonia',{}).get('NH4+',0.0)),\n        'nh3_mol_kg':float(weak.get('ammonia',{}).get('NH3',0.0)),\n        'nh4_mg_l_as_nh4':float(weak.get('ammonia',{}).get('NH4+',0.0))*kgw*NH4_EQ_MW*1000.0,\n        'nh3_mg_l_as_nh3':float(weak.get('ammonia',{}).get('NH3',0.0))*kgw*NH3_MW*1000.0,\n        'hydroxo_species':hydroxo,'noncarbonate_alkalinity_components_mol_kg':alk_components,\n        'pitzer': pit, 'weak_systems': weak, 'composition': comp_eq,\n    }\n\n\ndef equilibrium_charge_report(state: Mapping[str,object], temp_c: float) -> dict:\n    \"\"\"Electroneutrality report from the actual acid/base/hydrolysis species.\"\"\"\n    comp=normalize_composition(state.get('composition') or {})\n    kgw=_kg_water_per_l(comp,temp_c); m=_molalities(comp,temp_c)\n    weak=state.get('weak_systems') or weak_species_speciation(comp,temp_c,float(state.get('ph',7.0)))\n    hydro=state.get('hydroxo_species') or metal_hydroxo_speciation(comp,temp_c,float(state.get('ph',7.0)))\n    cat=0.0; an=0.0; rows=[]\n    def add(label, equivalents_mol_kg, side):\n        nonlocal cat,an\n        eq=max(0.0,float(equivalents_mol_kg)); meq_l=eq*kgw*1000.0\n        if side=='cation': cat+=eq\n        else: an+=eq\n        rows.append({'key':label,'label':label,'side':side,'meq_l':meq_l})\n    add('H+',float(state.get('h_mol_kg',0.0)),'cation')\n    add('NH4+',float(weak.get('ammonia',{}).get('NH4+',0.0)),'cation')\n    handled=set()\n    for key,item in hydro.items():\n        z=int(SPECIES[key][3]); handled.add(key)\n        add(key+' free',float(item.get('free_mol_kg',0.0))*max(z,0),'cation')\n        hz=int(item.get('hydroxo_charge',z-1))\n        if hz>0: add(str(item.get('label',key+'OH')),float(item.get('hydroxo_mol_kg',0.0))*hz,'cation')\n    for key in ('iron_iii',):\n        z=int(SPECIES[key][3]); add(key,float(m.get(key,0.0))*z,'cation')\n    add('chloride',float(m.get('chloride',0.0)),'anion')\n    add('sulfate',2.0*float(m.get('sulfate',0.0)),'anion')\n    add('nitrate',float(m.get('nitrate',0.0)),'anion')\n    add('bromide',float(m.get('bromide',0.0)),'anion')\n    add('bicarbonate',float(state.get('hco3_mol_kg',0.0)),'anion')\n    add('carbonate',2.0*float(state.get('co3_mol_kg',0.0)),'anion')\n    add('F-',float(weak.get('fluoride',{}).get('F-',0.0)),'anion')\n    p=weak.get('phosphate',{})\n    add('H2PO4-',float(p.get('H2PO4-',0.0)),'anion')\n    add('HPO4--',2.0*float(p.get('HPO4--',0.0)),'anion')\n    add('PO4---',3.0*float(p.get('PO4---',0.0)),'anion')\n    add('B(OH)4-',float(weak.get('boron',{}).get('B(OH)4-',0.0)),'anion')\n    s=weak.get('silica',{})\n    add('H3SiO4-',float(s.get('H3SiO4-',0.0)),'anion')\n    add('H2SiO4--',2.0*float(s.get('H2SiO4--',0.0)),'anion')\n    add('OH-',float(state.get('oh_mol_kg',0.0)),'anion')\n    cat_meq=cat*kgw*1000.0; an_meq=an*kgw*1000.0; denom=cat_meq+an_meq\n    imbalance=0.0 if denom<=1e-30 else 2.0*(cat_meq-an_meq)/denom*100.0\n    return {'rows':rows,'cations_meq_l':cat_meq,'anions_meq_l':an_meq,\n            'imbalance_pct':imbalance,'residual_meq_l':cat_meq-an_meq,\n            'status':'good' if abs(imbalance)<2 else ('review' if abs(imbalance)<5 else 'check'),\n            'basis':'explicit equilibrium species including NH4/NH3 and metal hydrolysis'}\n\n\ndef solve_charge_balanced_state(comp: Mapping[str,float], temp_c: float,\n                                total_inorganic_carbon_mol_kg: float) -> dict:\n    \"\"\"Solve pH from component totals + CT by explicit electroneutrality.\n\n    This is the authoritative downstream membrane/mixing pH solve. It avoids\n    assuming that total alkalinity itself follows one membrane rejection factor.\n    \"\"\"\n    analytical=_analytical_composition(comp); ct=max(0.0,float(total_inorganic_carbon_mol_kg))\n    states={}\n    def state_at(p):\n        key=float(p)\n        if key not in states: states[key]=_state_at_ph_ct(analytical,temp_c,key,ct)\n        return states[key]\n    def residual(p):\n        return equilibrium_charge_report(state_at(p),temp_c)['residual_meq_l']\n    grid=[CARBONATE_PH_MIN+(CARBONATE_PH_MAX-CARBONATE_PH_MIN)*i/80.0 for i in range(81)]\n    vals=[]\n    for p in grid:\n        vals.append((p,residual(p)))\n    root=None\n    for (p0,f0),(p1,f1) in zip(vals,vals[1:]):\n        if f0==0.0: root=p0; break\n        if f0*f1<=0.0:\n            root,_=brent_root(residual,p0,p1,xtol=1e-9,rtol=1e-12,max_iter=80); break\n    if root is None:\n        best_p,best_f=min(vals,key=lambda x:abs(x[1]))\n        if abs(best_f)<=1e-7:\n            root=best_p\n        else:\n            raise ValueError(f'Could not close downstream electroneutrality between pH {CARBONATE_PH_MIN:.0f} and {CARBONATE_PH_MAX:.0f}; residual {best_f:.3e} meq/L.')\n    st=dict(state_at(root)); st['charge_balance']=equilibrium_charge_report(st,temp_c)\n    st['ph_solver_basis']='component mass balance + CT + explicit electroneutrality'\n    return st\n\n\ndef solve_carbonate_state"""
          chem = replace_once(chem, old_return_tail, new_return_tail, 'state diagnostics + electroneutrality solver')

          new_split = r'''def membrane_carbonate_split(feed_comp: Mapping[str,float], temp_c:float, feed_state:dict,
                              recovery:float, ionic_rejection:float,
                              permeate_template:Mapping[str,float], concentrate_template:Mapping[str,float]) -> dict:
    """Conserve carbon/components and solve downstream pH by electroneutrality.

    Neutral CO2 is assigned unit passage while ionic carbonate follows ionic
    rejection. NH4/NH3 transport is already embedded in the permeate/concentrate
    templates, so permeate and concentrate pH are solved simultaneously with all
    transported weak-species totals and metal hydrolysis effects.
    """
    y=min(max(float(recovery),0.0),0.999999999)
    rej=min(max(float(ionic_rejection),0.0),0.999999999)
    fcomp=feed_state.get('composition') or normalize_composition(feed_comp)
    kgwf=_kg_water_per_l(fcomp,temp_c)
    ct_l=feed_state['total_inorganic_carbon_mol_kg']*kgwf
    co2_l=feed_state['co2_mol_kg']*kgwf
    # Neutral CO2 has unit concentration passage; ionic inorganic carbon follows
    # the membrane ionic passage. Total carbon is then closed on the concentrate.
    ct_p_l=co2_l + max(0.0,ct_l-co2_l)*(1.0-rej)
    if y<=1e-12:
        ct_c_l=ct_l
    else:
        ct_c_l=(ct_l-y*ct_p_l)/max(1.0-y,1e-30)
    pbase=_base_noncarbonate_composition(permeate_template)
    cbase=_base_noncarbonate_composition(concentrate_template)
    kgwp=_kg_water_per_l(pbase,temp_c); kgwc=_kg_water_per_l(cbase,temp_c)
    ct_p=ct_p_l/max(kgwp,1e-30); ct_c=ct_c_l/max(kgwc,1e-30)
    pst=solve_charge_balanced_state(pbase,temp_c,ct_p)
    cst=solve_charge_balanced_state(cbase,temp_c,ct_c)
    return {'feed':feed_state,'permeate':pst,'concentrate':cst,'ionic_rejection':rej,'recovery':y,
            'transport_solver_basis':'component mass balance + neutral CO2 passage + electroneutrality'}


'''
          chem = replace_between(chem, 'def membrane_carbonate_split(', 'def mix_carbonate_streams(', new_split, 'membrane downstream chemistry replacement')

          new_mix = r'''def mix_carbonate_streams(streams, temp_c:float) -> dict:
    """Flow-weight transported components/CT and solve mixed pH by charge balance."""
    valid=[x for x in streams if float(x.get('flow',0) or 0)>0 and x.get('composition') and x.get('state')]
    if not valid: raise ValueError('At least one positive-flow carbonate stream is required for mixing.')
    qt=sum(float(x['flow']) for x in valid)
    mix={k:0.0 for k in SPECIES}; ct_l=0.0
    for x in valid:
        q=float(x['flow']); comp=normalize_composition(x['composition']); st=x['state']; kgw=_kg_water_per_l(comp,temp_c)
        for k in SPECIES: mix[k]+=q*comp[k]/qt
        ct_l+=q*float(st['total_inorganic_carbon_mol_kg'])*kgw/qt
    base=_base_noncarbonate_composition(mix); kgw=_kg_water_per_l(base,temp_c)
    st=solve_charge_balanced_state(base,temp_c,ct_l/max(kgw,1e-30))
    st['mixing_basis']='flow-weighted component totals + CT + electroneutrality'
    return st

'''
          chem = replace_between(chem, 'def mix_carbonate_streams(', 'def carbonate_speciation(', new_mix, 'mixed-stream electroneutrality replacement')

          old_eq_report = """def _equilibrated_charge_report(comp: Mapping[str,float], temp_c:float, ph:float):\n    analytical = _analytical_composition(comp)\n    ta = _ta_mol_kg_from_mg_l_as_hco3(analytical, temp_c)\n    st = solve_carbonate_state(analytical, temp_c, ph=float(ph), total_alkalinity_mol_kg=ta)\n    return st, charge_report(st['composition'])\n"""
          new_eq_report = """def _equilibrated_charge_report(comp: Mapping[str,float], temp_c:float, ph:float):\n    analytical = _analytical_composition(comp)\n    ta = _ta_mol_kg_from_mg_l_as_hco3(analytical, temp_c)\n    st = solve_carbonate_state(analytical, temp_c, ph=float(ph), total_alkalinity_mol_kg=ta)\n    return st, equilibrium_charge_report(st,temp_c)\n"""
          chem = replace_once(chem, old_eq_report, new_eq_report, 'equilibrium charge-balance reporting')

          old_analyze = """    c=carb_state['composition']; m=_molalities(c,temp_c); weak=weak_species_speciation(c,temp_c,ph)\n"""
          new_analyze = """    c=carb_state['composition']; m=_molalities(c,temp_c); weak=carb_state.get('weak_systems') or weak_species_speciation(c,temp_c,ph)\n"""
          chem = replace_once(chem, old_analyze, new_analyze, 'reuse authoritative weak state')

          old_cr = """    cr=charge_report(c); larson=(cr['rows'][0]['meq_l']*0) # placeholder overwritten below\n    meq={x['key']:x['meq_l'] for x in cr['rows']}\n"""
          new_cr = """    cr=equilibrium_charge_report(carb_state,temp_c)\n    raw_cr=charge_report(c); larson=(raw_cr['rows'][0]['meq_l']*0) # placeholder overwritten below\n    meq={x['key']:x['meq_l'] for x in raw_cr['rows']}\n"""
          chem = replace_once(chem, old_cr, new_cr, 'analysis equilibrium charge report')

          old_spec_tail = """                          'co3_mol_kg':m['carbonate'],'co3_mg_l':carb_state['co3_mg_l'],'oh_mol_kg':oh,'h_mol_kg':h,\n                          'free_mol_kg':free,'activities':act,'weak_systems':weak},\n"""
          new_spec_tail = """                          'co3_mol_kg':m['carbonate'],'co3_mg_l':carb_state['co3_mg_l'],'oh_mol_kg':oh,'h_mol_kg':h,\n                          'free_mol_kg':free,'activities':act,'weak_systems':weak,\n                          'hydroxo_species':carb_state.get('hydroxo_species',{}),\n                          'noncarbonate_alkalinity_components_mol_kg':carb_state.get('noncarbonate_alkalinity_components_mol_kg',{})},\n"""
          chem = replace_once(chem, old_spec_tail, new_spec_tail, 'expose hydrolysis/speciation diagnostics')
          chem_path.write_text(chem, encoding='utf-8')

          calc_path = Path('calculations.py')
          calc = calc_path.read_text(encoding='utf-8')
          old_import = "from chemistry_analysis import solve_carbonate_state, analytical_alkalinity_mol_kg, membrane_carbonate_split, mix_carbonate_streams, acid_dose_to_target_ph"
          new_import = "from chemistry_analysis import (solve_carbonate_state, solve_charge_balanced_state, analytical_alkalinity_mol_kg, membrane_carbonate_split, mix_carbonate_streams, acid_dose_to_target_ph, ammonia_membrane_transport)"
          calc = replace_once(calc, old_import, new_import, 'calculations chemistry imports')

          old_sig = """                   feed_carbonate_state=None, resolve_carbonate_streams=True,\n                   membrane_recipe=None):\n"""
          new_sig = """                   feed_carbonate_state=None, resolve_carbonate_streams=True,\n                   membrane_recipe=None, neutral_ammonia_rejection_pct=0.0):\n"""
          calc = replace_once(calc, old_sig, new_sig, 'membrane-stage ammonia setting')

          old_initial = """        cp = cin * (1.0-r_test_local)\n        if full and is_nf:\n            cp_comp = nf_permeate_composition(comp_in, float(m.get(\"test_flux_lmh\", 30.0)),\n                                               tr[\"nf_b_mm\"], tr[\"nf_b_dd\"], tr.get(\"nf_b_mix\"), tr.get(\"nf_b_neutral\"))\n            cp = total_tds_mg_l(cp_comp)\n        else:\n            cp_comp = permeate_composition(comp_in, r_test_local, rb_test_local) if full else None\n        last_qp = None\n        element_relax = 0.45\n        previous_raw_residual = None\n        previous_q_residual = None\n"""
          new_initial = """        cp = cin * (1.0-r_test_local)\n        neutral_nh3_raw=m.get(\"neutral_ammonia_rejection_pct\",neutral_ammonia_rejection_pct)\n        neutral_nh3_rej=float(neutral_nh3_raw or 0.0)\n        if neutral_nh3_rej>1.0: neutral_nh3_rej/=100.0\n        neutral_nh3_rej=min(max(neutral_nh3_rej,0.0),0.999999999)\n        if full and is_nf:\n            initial_flux=float(m.get(\"test_flux_lmh\",30.0))\n            initial_nf_rej=nf_dynamic_rejections(initial_flux,tr[\"nf_b_mm\"],tr[\"nf_b_dd\"],tr.get(\"nf_b_mix\"),tr.get(\"nf_b_neutral\"))\n            cp_comp = nf_permeate_composition(comp_in, initial_flux,\n                                               tr[\"nf_b_mm\"], tr[\"nf_b_dd\"], tr.get(\"nf_b_mix\"), tr.get(\"nf_b_neutral\"))\n            initial_amm=ammonia_membrane_transport(comp_in,temperature_c,float((carbonate_state_current or {}).get(\"ph\",feed_ph)),\n                                                    initial_nf_rej[\"mono_mono\"],initial_nf_rej[\"neutral\"])\n            cp_comp[\"ammonium\"]=initial_amm[\"permeate_total_ammonia_mg_l_as_nh4\"]\n            cp = total_tds_mg_l(cp_comp)\n        else:\n            cp_comp = permeate_composition(comp_in, r_test_local, rb_test_local) if full else None\n            if full:\n                initial_amm=ammonia_membrane_transport(comp_in,temperature_c,float((carbonate_state_current or {}).get(\"ph\",feed_ph)),\n                                                        r_test_local,neutral_nh3_rej)\n                cp_comp[\"ammonium\"]=initial_amm[\"permeate_total_ammonia_mg_l_as_nh4\"]\n                cp=total_tds_mg_l(cp_comp)\n        last_qp = None\n        element_relax = 0.45\n        previous_raw_residual = None\n        previous_q_residual = None\n        ammonia_transport_current = None\n"""
          calc = replace_once(calc, old_initial, new_initial, 'initial ammonia transport state')

          old_transport = """            nf_rej_local = None\n            if full:\n                if is_nf:\n                    nf_rej_local = nf_dynamic_rejections(flux, tr[\"nf_b_mm\"], tr[\"nf_b_dd\"], tr.get(\"nf_b_mix\"), tr.get(\"nf_b_neutral\"))\n                    cp_new_comp = nf_permeate_composition(cm_comp, flux, tr[\"nf_b_mm\"], tr[\"nf_b_dd\"], tr.get(\"nf_b_mix\"), tr.get(\"nf_b_neutral\"))\n                    cp_new = total_tds_mg_l(cp_new_comp)\n                    rej = min(max(1.0-cp_new/max(total_tds_mg_l(cm_comp),1e-12),0.0),0.999999999)\n                else:\n                    cp_new_comp = permeate_composition(cm_comp, rej, boron_dynamic_rejection(rej, r_test_local, rb_test_local))\n                    cp_new = total_tds_mg_l(cp_new_comp)\n            else:\n                cp_new = max(0.0, cm_tds * (1.0 - rej))\n                cp_new_comp = None\n"""
          new_transport = """            nf_rej_local = None\n            if full:\n                if is_nf:\n                    nf_rej_local = nf_dynamic_rejections(flux, tr[\"nf_b_mm\"], tr[\"nf_b_dd\"], tr.get(\"nf_b_mix\"), tr.get(\"nf_b_neutral\"))\n                    cp_new_comp = nf_permeate_composition(cm_comp, flux, tr[\"nf_b_mm\"], tr[\"nf_b_dd\"], tr.get(\"nf_b_mix\"), tr.get(\"nf_b_neutral\"))\n                    cp_ionic = total_tds_mg_l(cp_new_comp)\n                    rej = min(max(1.0-cp_ionic/max(total_tds_mg_l(cm_comp),1e-12),0.0),0.999999999)\n                    ammonia_ionic_rej=nf_rej_local[\"mono_mono\"]; ammonia_neutral_rej=nf_rej_local[\"neutral\"]\n                else:\n                    cp_new_comp = permeate_composition(cm_comp, rej, boron_dynamic_rejection(rej, r_test_local, rb_test_local))\n                    ammonia_ionic_rej=rej; ammonia_neutral_rej=neutral_nh3_rej\n                # Hydraulic hot-loop uses the current element bulk pH as the NH3\n                # partition predictor. The accepted full-detail point below performs\n                # one charge-balanced membrane-surface pH correction.\n                surface_ph_predictor=float((carbonate_state_current or {}).get(\"ph\",feed_ph))\n                ammonia_transport_current=ammonia_membrane_transport(cm_comp,temperature_c,surface_ph_predictor,\n                                                                     ammonia_ionic_rej,ammonia_neutral_rej)\n                cp_new_comp[\"ammonium\"]=ammonia_transport_current[\"permeate_total_ammonia_mg_l_as_nh4\"]\n                cp_new = total_tds_mg_l(cp_new_comp)\n            else:\n                cp_new = max(0.0, cm_tds * (1.0 - rej))\n                cp_new_comp = None\n"""
          calc = replace_once(calc, old_transport, new_transport, 'iterative NH4/NH3 transport')

          old_final_surface = """            comp_out = concentrate_composition(comp_in, qin, cp_comp, qp)\n            cavg_comp = {k:0.5*(comp_in[k]+comp_out[k]) for k in SPECIES}\n            cm_comp = (nf_polarization_scale_composition(cavg_comp,pf,pf_divalent)\n                       if is_nf else polarization_scale_composition(cavg_comp,pf,pf_divalent))\n            osm_m = osm_state_comp(cm_comp); osm_p = osm_state_comp(cp_comp)\n            csplit = None\n            if resolve_carbonate_streams:\n                carbonate_rej = (nf_rej_local or {}).get('mono_mono', rej) if is_nf else rej\n                csplit=membrane_carbonate_split(comp_in,temperature_c,carbonate_state_current,yi,carbonate_rej,cp_comp,comp_out)\n"""
          new_final_surface = """            comp_out = concentrate_composition(comp_in, qin, cp_comp, qp)\n            cavg_comp = {k:0.5*(comp_in[k]+comp_out[k]) for k in SPECIES}\n            cm_comp = (nf_polarization_scale_composition(cavg_comp,pf,pf_divalent)\n                       if is_nf else polarization_scale_composition(cavg_comp,pf,pf_divalent))\n            membrane_surface_state = None\n            surface_ph_final=float((carbonate_state_current or {}).get(\"ph\",feed_ph))\n            if resolve_carbonate_streams and element_feed_state is not None:\n                try:\n                    avg_flow=max(0.5*(qin+qout),1e-12)\n                    hydraulic_cf=qin/avg_flow\n                    cp_cf=total_tds_mg_l(cm_comp)/max(total_tds_mg_l(cavg_comp),1e-12)\n                    surface_ct=float(element_feed_state.get(\"total_inorganic_carbon_mol_kg\",0.0))*hydraulic_cf*cp_cf\n                    membrane_surface_state=solve_charge_balanced_state(cm_comp,temperature_c,surface_ct)\n                    surface_ph_final=float(membrane_surface_state[\"ph\"])\n                except (KeyError,ValueError,ZeroDivisionError,OverflowError):\n                    membrane_surface_state=None\n            if is_nf:\n                final_nf_rej=nf_dynamic_rejections(max(qp*1000.0/area_each,0.0),tr[\"nf_b_mm\"],tr[\"nf_b_dd\"],tr.get(\"nf_b_mix\"),tr.get(\"nf_b_neutral\"))\n                ammonia_ionic_rej=final_nf_rej[\"mono_mono\"]; ammonia_neutral_rej=final_nf_rej[\"neutral\"]\n            else:\n                ammonia_ionic_rej=rej; ammonia_neutral_rej=neutral_nh3_rej\n            ammonia_transport_current=ammonia_membrane_transport(cm_comp,temperature_c,surface_ph_final,\n                                                                 ammonia_ionic_rej,ammonia_neutral_rej)\n            cp_comp=dict(cp_comp); cp_comp[\"ammonium\"]=ammonia_transport_current[\"permeate_total_ammonia_mg_l_as_nh4\"]\n            # Re-close concentrate mass balance after the final neutral-ammonia correction.\n            comp_out = concentrate_composition(comp_in, qin, cp_comp, qp)\n            cavg_comp = {k:0.5*(comp_in[k]+comp_out[k]) for k in SPECIES}\n            cm_comp = (nf_polarization_scale_composition(cavg_comp,pf,pf_divalent)\n                       if is_nf else polarization_scale_composition(cavg_comp,pf,pf_divalent))\n            osm_m = osm_state_comp(cm_comp); osm_p = osm_state_comp(cp_comp)\n            csplit = None\n            if resolve_carbonate_streams:\n                carbonate_rej = (nf_rej_local or {}).get('mono_mono', rej) if is_nf else rej\n                csplit=membrane_carbonate_split(comp_in,temperature_c,carbonate_state_current,yi,carbonate_rej,cp_comp,comp_out)\n"""
          calc = replace_once(calc, old_final_surface, new_final_surface, 'final surface-pH/ammonia correction')

          old_full_update = """                \"cumulative_permeate_out_flow_m3h\": cumulative_out_flow,\n                \"cumulative_permeate_out_composition_mg_l\": cumulative_out_comp,\n            })\n"""
          new_full_update = """                \"cumulative_permeate_out_flow_m3h\": cumulative_out_flow,\n                \"cumulative_permeate_out_composition_mg_l\": cumulative_out_comp,\n                \"membrane_surface_ph\": surface_ph_final,\n                \"membrane_surface_charge_state\": (membrane_surface_state.get(\"charge_balance\") if membrane_surface_state else None),\n                \"ammonia_transport\": dict(ammonia_transport_current or {}),\n            })\n"""
          calc = replace_once(calc, old_full_update, new_full_update, 'element chemistry diagnostics')

          old_stage_call = """                           feed_carbonate_state=feed_carbonate_state,\n                           resolve_carbonate_streams=not _bool(data, \"_solver_fast\", False),\n                           membrane_recipe=recipe)\n"""
          new_stage_call = """                           feed_carbonate_state=feed_carbonate_state,\n                           resolve_carbonate_streams=not _bool(data, \"_solver_fast\", False),\n                           membrane_recipe=recipe,\n                           neutral_ammonia_rejection_pct=_float(data,\"neutral_ammonia_rejection_pct\",0.0) or 0.0)\n"""
          calc = replace_once(calc, old_stage_call, new_stage_call, 'stage ammonia transport setting')

          old_stage_return = """        **({\"feed_ph\":carbon_split[\"feed\"][\"ph\"],\"concentrate_ph\":carbon_split[\"concentrate\"][\"ph\"],\"permeate_ph\":carbon_split[\"permeate\"][\"ph\"],\n            \"feed_total_alkalinity_mol_kg\":carbon_split[\"feed\"][\"total_alkalinity_mol_kg\"],\"concentrate_total_alkalinity_mol_kg\":carbon_split[\"concentrate\"][\"total_alkalinity_mol_kg\"],\"permeate_total_alkalinity_mol_kg\":carbon_split[\"permeate\"][\"total_alkalinity_mol_kg\"],\n            \"feed_total_inorganic_carbon_mol_kg\":carbon_split[\"feed\"][\"total_inorganic_carbon_mol_kg\"],\"concentrate_total_inorganic_carbon_mol_kg\":carbon_split[\"concentrate\"][\"total_inorganic_carbon_mol_kg\"],\"permeate_total_inorganic_carbon_mol_kg\":carbon_split[\"permeate\"][\"total_inorganic_carbon_mol_kg\"],\n            \"feed_alkalinity_mg_l_as_hco3\":carbon_split[\"feed\"][\"total_alkalinity_mg_l_as_hco3\"],\"concentrate_alkalinity_mg_l_as_hco3\":carbon_split[\"concentrate\"][\"total_alkalinity_mg_l_as_hco3\"],\"permeate_alkalinity_mg_l_as_hco3\":carbon_split[\"permeate\"][\"total_alkalinity_mg_l_as_hco3\"]} if (full and resolve_carbonate_streams) else {}),\n"""
          new_stage_return = """        **({\"feed_ph\":carbon_split[\"feed\"][\"ph\"],\"concentrate_ph\":carbon_split[\"concentrate\"][\"ph\"],\"permeate_ph\":carbon_split[\"permeate\"][\"ph\"],\n            \"feed_total_alkalinity_mol_kg\":carbon_split[\"feed\"][\"total_alkalinity_mol_kg\"],\"concentrate_total_alkalinity_mol_kg\":carbon_split[\"concentrate\"][\"total_alkalinity_mol_kg\"],\"permeate_total_alkalinity_mol_kg\":carbon_split[\"permeate\"][\"total_alkalinity_mol_kg\"],\n            \"feed_total_inorganic_carbon_mol_kg\":carbon_split[\"feed\"][\"total_inorganic_carbon_mol_kg\"],\"concentrate_total_inorganic_carbon_mol_kg\":carbon_split[\"concentrate\"][\"total_inorganic_carbon_mol_kg\"],\"permeate_total_inorganic_carbon_mol_kg\":carbon_split[\"permeate\"][\"total_inorganic_carbon_mol_kg\"],\n            \"feed_alkalinity_mg_l_as_hco3\":carbon_split[\"feed\"][\"total_alkalinity_mg_l_as_hco3\"],\"concentrate_alkalinity_mg_l_as_hco3\":carbon_split[\"concentrate\"][\"total_alkalinity_mg_l_as_hco3\"],\"permeate_alkalinity_mg_l_as_hco3\":carbon_split[\"permeate\"][\"total_alkalinity_mg_l_as_hco3\"],\n            \"feed_ammonia_speciation\":carbon_split[\"feed\"].get(\"weak_systems\",{}).get(\"ammonia\",{}),\n            \"concentrate_ammonia_speciation\":carbon_split[\"concentrate\"].get(\"weak_systems\",{}).get(\"ammonia\",{}),\n            \"permeate_ammonia_speciation\":carbon_split[\"permeate\"].get(\"weak_systems\",{}).get(\"ammonia\",{}),\n            \"feed_hydroxo_species\":carbon_split[\"feed\"].get(\"hydroxo_species\",{}),\n            \"concentrate_hydroxo_species\":carbon_split[\"concentrate\"].get(\"hydroxo_species\",{}),\n            \"permeate_hydroxo_species\":carbon_split[\"permeate\"].get(\"hydroxo_species\",{}),\n            \"concentrate_charge_balance\":carbon_split[\"concentrate\"].get(\"charge_balance\"),\n            \"permeate_charge_balance\":carbon_split[\"permeate\"].get(\"charge_balance\")} if (full and resolve_carbonate_streams) else {}),\n"""
          calc = replace_once(calc, old_stage_return, new_stage_return, 'stage-level weak-species diagnostics')
          calc_path.write_text(calc, encoding='utf-8')
          PY

      - name: Validate upgraded chemistry
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile chemistry_analysis.py calculations.py water_chemistry.py solver/root_scalar.py
          python3 - <<'PY'
          import math
          import calculations
          from chemistry_analysis import (weak_species_speciation, metal_hydroxo_speciation,
              ammonia_membrane_transport, solve_carbonate_state, solve_charge_balanced_state,
              analytical_alkalinity_mol_kg, equilibrium_charge_report)
          from water_chemistry import SPECIES

          comp={k:0.0 for k in SPECIES}
          comp.update({
              'sodium':229.89769, 'chloride':354.53,
              'calcium':40.078, 'sulfate':96.06,
              'bicarbonate':61.0168, 'ammonium':18.03846,
          })
          w8=weak_species_speciation(comp,25.0,8.0)['ammonia']
          w10=weak_species_speciation(comp,25.0,10.0)['ammonia']
          assert w10['neutral_fraction'] > w8['neutral_fraction'] >= 0.0
          h8=metal_hydroxo_speciation(comp,25.0,8.0)['calcium']['hydrolyzed_fraction']
          h10=metal_hydroxo_speciation(comp,25.0,10.0)['calcium']['hydrolyzed_fraction']
          assert h10 > h8 >= 0.0
          tr=ammonia_membrane_transport(comp,25.0,10.0,0.99,0.0)
          assert tr['permeate_total_ammonia_mg_l_as_nh4'] > comp['ammonium']*0.01
          ta=analytical_alkalinity_mol_kg(comp,25.0)
          feed=solve_carbonate_state(comp,25.0,ph=8.0,total_alkalinity_mol_kg=ta)
          charge=equilibrium_charge_report(feed,25.0)
          assert math.isfinite(charge['residual_meq_l'])
          # Re-solve the same transported component set from CT by electroneutrality.
          downstream=solve_charge_balanced_state(feed['composition'],25.0,feed['total_inorganic_carbon_mol_kg'])
          assert 2.0 <= downstream['ph'] <= 12.0
          assert abs(downstream['charge_balance']['residual_meq_l']) < 1e-5
          assert 'CaOH+' in {x['label'] for x in downstream['hydroxo_species'].values()}
          print('PASS - NH3 transport, hydrolysis, and electroneutrality smoke tests')
          PY
          git diff --check
          git diff --stat

      - name: Commit chemistry upgrade to alpha
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Total Water Design Suite Automation"
          git config user.email "admin@totalrodesign.com"
          git add chemistry_analysis.py calculations.py
          git commit -m "Couple NH3 transport hydrolysis and downstream electroneutrality"
          git push origin HEAD:alpha
