name: Alpha Runner Smoke Test

on:
  push:
    branches:
      - alpha

jobs:
  smoke-test:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - twds-alpha
      - ec2

    steps:
      - name: Checkout alpha
        uses: actions/checkout@v4

      - name: Runner identity
        run: |
          echo "User: $(whoami)"
          echo "Host: $(hostname)"
          echo "Commit: $(git rev-parse --short HEAD)"

      - name: Verify TWDS services
        run: |
          systemctl is-active totalrodesign.service
          systemctl is-active totalbiodesign.service

      - name: Verify security isolation
        run: |
          test ! -r /etc/totalrodesign/totalrodesign.env
          test ! -r /var/lib/totalrodesign/totalrodesign.db
          echo "PASS - runner cannot read TWDS secrets or database"
