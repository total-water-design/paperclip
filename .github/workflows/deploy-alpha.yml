name: Deploy Alpha

on:
  workflow_dispatch:
  push:
    branches:
      - alpha

permissions:
  contents: read
  statuses: write

concurrency:
  group: twds-alpha-deployment
  cancel-in-progress: false

jobs:
  deploy-alpha:
    name: Deploy alpha to EC2
    runs-on:
      - self-hosted
      - Linux
      - X64
      - twds-alpha
      - ec2
    timeout-minutes: 15

    steps:
      - name: Publish deployment pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"twds-alpha/deployment","description":"Alpha deployment in progress"}' >/dev/null

      - name: Checkout exact triggering Alpha commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Identify deployment
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "Deploying commit: $ACTUAL"
          test "$ACTUAL" = "$GITHUB_SHA"

      - name: Validate source tree
        run: |
          set -e
          test -f app.py
          test -f auth.py
          test -f wsgi.py
          test -f requirements-server.txt
          test -d static
          test -d templates

          if find . \
            \( -name '.env' \
               -o -name '*.db' \
               -o -name '*.sqlite' \
               -o -name '*.sqlite3' \
               -o -name '*.pem' \
               -o -name '*.key' \
               -o -name 'instance' \
            \) \
            -not -path './.git/*' \
            -print | grep -q .; then
              echo "ERROR: forbidden runtime or secret files detected."
              exit 1
          fi
          python3 -m compileall -q .
          echo "PASS - source validation"

      - name: Prepare restricted staging tree
        run: |
          set -euo pipefail
          STAGE=/opt/twds-deploy/staging
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='instance/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='*.db' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite3' \
            --exclude='*.pem' \
            --exclude='*.key' \
            "$GITHUB_WORKSPACE/" "$STAGE/"
          printf '%s\n' "$GITHUB_SHA" > "$STAGE/.deployment_commit"
          test "$(cat "$STAGE/.deployment_commit")" = "$GITHUB_SHA"
          echo "Staging prepared for exact commit $GITHUB_SHA"

      - name: Deploy with backup and rollback protection
        run: sudo /usr/local/sbin/twds-alpha-deploy

      - name: Final service verification
        run: |
          set -euo pipefail
          systemctl is-active totalrodesign.service
          systemctl is-active totalbiodesign.service
          if systemctl list-unit-files --type=service 2>/dev/null | grep -q '^totalzlddesign\.service'; then
            systemctl is-active totalzlddesign.service
          else
            echo "Total ZLD Design service is not deployed; skipping service check."
          fi
          curl -fsS --max-time 10 http://127.0.0.1:8000/ >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1:8000/healthz >/dev/null
          LOGIN_CODE="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login)"
          test "$LOGIN_CODE" = "200"
          echo "PASS - alpha deployment healthy"

      - name: Publish deployment success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"twds-alpha/deployment","description":"Exact Alpha commit deployed; rollback-protected checks passed"}' >/dev/null

      - name: Publish deployment failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"twds-alpha/deployment","description":"Alpha deployment or health verification failed"}' >/dev/null
