name: Deploy Alpha

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA already present on alpha
        required: true
        type: string
      resolverPolicy:
        description: Fresh per-run human confirmation; must be human_only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: twds-alpha-deployment
  cancel-in-progress: false

jobs:
  deploy-alpha:
    name: Deploy approved alpha SHA to EC2
    # Job-level conditions are evaluated before GitHub assigns a self-hosted runner.
    # This blocks pull-request runs and workflow-dispatch runs without a fresh
    # per-run human_only resolver-policy confirmation.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.resolverPolicy == 'human_only'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - twds-alpha
      - ec2

    timeout-minutes: 15

    env:
      REQUESTED_SHA: ${{ inputs.commit_sha }}

    steps:
      - name: Validate requested SHA format
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: commit_sha must be a full lowercase 40-character Git SHA."
            exit 1
          fi

          echo "Requested deployment SHA: $REQUESTED_SHA"

      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify exact SHA, clean provenance, and authorized Alpha ref
        shell: bash
        run: |
          set -Eeuo pipefail

          ACTUAL_SHA="$(git rev-parse HEAD)"

          echo "Requested SHA: $REQUESTED_SHA"
          echo "Checked out:   $ACTUAL_SHA"

          [[ "$ACTUAL_SHA" == "$REQUESTED_SHA" ]] || {
            echo "ERROR: checked-out SHA does not match requested SHA."
            exit 1
          }

          # Workflow input is deliberately an immutable object ID, never a
          # branch/ref.  Fetch and compare the authorized remote directly so a
          # stale local tracking ref, task branch, or moved branch tip cannot
          # become deployment source.
          git fetch --no-tags origin "+refs/heads/alpha:refs/remotes/origin/alpha"
          REMOTE_ALPHA_LINE="$(git ls-remote --exit-code origin refs/heads/alpha)"
          REMOTE_ALPHA_SHA="${REMOTE_ALPHA_LINE%%$'\t'*}"
          TRACKING_ALPHA_SHA="$(git rev-parse refs/remotes/origin/alpha)"

          [[ "$REMOTE_ALPHA_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: authorized remote alpha ref did not resolve to a full SHA."
            exit 1
          }
          [[ "$TRACKING_ALPHA_SHA" == "$REMOTE_ALPHA_SHA" ]] || {
            echo "ERROR: local authorized-alpha tracking ref differs from origin."
            exit 1
          }
          [[ "$REQUESTED_SHA" == "$REMOTE_ALPHA_SHA" ]] || {
            echo "ERROR: requested SHA is not the current authorized alpha SHA."
            exit 1
          }

          if ! git merge-base --is-ancestor "$REQUESTED_SHA" origin/alpha; then
            echo "ERROR: requested SHA is not contained in the alpha branch history."
            exit 1
          fi

          git diff --quiet
          git diff --cached --quiet
          [[ -z "$(git ls-files --others --exclude-standard)" ]] || {
            echo "ERROR: checkout contains untracked source; refusing mutable deployment tree."
            exit 1
          }

          echo "PASS - exact SHA, clean checkout, and origin alpha provenance verified"

      - name: Identify deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Deploying commit:"
          git rev-parse HEAD
          echo
          echo "Short commit:"
          git rev-parse --short HEAD

      - name: Validate source tree
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f app.py
          test -f auth.py
          test -f wsgi.py
          test -f requirements-server.txt
          test -d static
          test -d templates

          if find . \
            \( -name '.env' \
               -o -name '*.db' \
               -o -name '*.sqlite' \
               -o -name '*.sqlite3' \
               -o -name '*.pem' \
               -o -name '*.key' \
               -o -name 'instance' \
            \) \
            -not -path './.git/*' \
            -print | grep -q .; then
              echo "ERROR: forbidden runtime or secret files detected."
              exit 1
          fi

          python3 tools/materialize_batch_ro_build.py --check

          python3 -m compileall -q .

          echo "PASS - source validation"

      - name: Prepare exact-commit deployment bundle
        shell: bash
        run: |
          set -Eeuo pipefail

          STAGE=/opt/twds-deploy/staging
          REMOTE_ALPHA_LINE="$(git ls-remote --exit-code origin refs/heads/alpha)"
          REMOTE_ALPHA_SHA="${REMOTE_ALPHA_LINE%%$'\t'*}"
          deploy/prepare_exact_commit_bundle.sh \
            "$STAGE" \
            "$REQUESTED_SHA" \
            "$GITHUB_REPOSITORY" \
            "$REMOTE_ALPHA_SHA"

      - name: Deploy through human approval gate
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo /usr/local/sbin/twds-alpha-deploy-gated

      - name: Final service verification
        shell: bash
        run: |
          set -Eeuo pipefail

          systemctl is-active totalrodesign.service
          systemctl is-active totalbiodesign.service

          curl -fsS --max-time 10 http://127.0.0.1:8000/healthz >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1:8000/ >/dev/null

          echo "PASS - alpha deployment healthy"
          echo "Deployed approved SHA: $REQUESTED_SHA"
