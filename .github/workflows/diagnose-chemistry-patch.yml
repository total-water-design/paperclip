name: Diagnose Chemistry Patch

on:
  push:
    branches:
      - alpha
    paths:
      - .github/workflows/diagnose-chemistry-patch.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout chemistry work branch
        uses: actions/checkout@v5
        with:
          ref: chemistry-upgrade-work
          fetch-depth: 0

      - name: Capture patch applicability
        shell: bash
        run: |
          set +e
          {
            echo "=== git apply --check --verbose ==="
            git apply --check --verbose chemistry_upgrade.patch
            RC=$?
            echo
            echo "exit_code=$RC"
            echo
            echo "=== relevant chemistry anchors ==="
            grep -n "return st, charge_report\|cr=charge_report\|free_mol_kg.*weak_systems\|def acid_dose_to_target_ph" chemistry_analysis.py || true
            echo
            echo "=== relevant calculations anchors ==="
            grep -n "from chemistry_analysis import\|def membrane_stage\|cp = cin \* (1.0-r_test_local)\|nf_rej_local = None\|membrane_recipe=recipe" calculations.py || true
          } > PATCH_DIAGNOSTIC.txt 2>&1
          exit 0

      - name: Commit diagnostic to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Total Water Design Suite Automation"
          git config user.email "admin@totalrodesign.com"
          git add PATCH_DIAGNOSTIC.txt
          git commit -m "Capture advanced chemistry patch diagnostic" || true
          git push origin HEAD:chemistry-upgrade-work
