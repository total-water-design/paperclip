name: Alpha Final Health Sync

on:
  push:
    branches:
      - alpha

permissions:
  contents: read
  statuses: write

concurrency:
  group: twds-alpha-final-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - twds-alpha
      - ec2
    timeout-minutes: 15
    steps:
      - name: Publish pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d '{"state":"pending","context":"twds-alpha/ccro-final","description":"Waiting for exact Alpha deployment status"}' >/dev/null

      - name: Checkout exact Alpha source for release verification
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify tracked CCRO and release source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f app.py
          test -f auth.py
          test -f addons/ccro/engine.py
          test -f addons/ccro/__init__.py
          test -f static/addons/ccro/ccro_addon.js
          python3 -m py_compile addons/ccro/__init__.py addons/ccro/engine.py

      - name: Wait for protected deployment result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            BODY="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")"
            STATE="$(printf '%s' "$BODY" | python3 -c 'import json,sys; d=json.load(sys.stdin); rows=[x for x in d.get("statuses",[]) if x.get("context")=="twds-alpha/deployment"]; print(rows[0].get("state","") if rows else "")')"
            if [ "$STATE" = success ]; then
              echo "Protected deployment status is success for $GITHUB_SHA"
              exit 0
            fi
            if [ "$STATE" = failure ] || [ "$STATE" = error ]; then
              echo "Protected deployment reported $STATE for $GITHUB_SHA"
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for protected Alpha deployment status."
          exit 1

      - name: Verify services and Suite routes
        run: |
          set -euo pipefail
          systemctl is-active totalrodesign.service
          systemctl is-active totalbiodesign.service
          if systemctl list-unit-files --type=service 2>/dev/null | grep -q '^totalzlddesign\.service'; then
            systemctl is-active totalzlddesign.service
          else
            echo "Total ZLD Design service is not deployed; skipping service check."
          fi
          curl -fsS --max-time 10 http://127.0.0.1:8000/ >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1:8000/healthz >/dev/null
          test "$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login)" = 200
          RO_CODE="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ro)"
          case "$RO_CODE" in 200|301|302|401|403) ;; *) echo "Unexpected /ro HTTP $RO_CODE"; exit 1;; esac
          PROJECT_CODE="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/projects)"
          case "$PROJECT_CODE" in 200|301|302|401|403) ;; *) echo "Unexpected project API HTTP $PROJECT_CODE"; exit 1;; esac

      - name: Verify authenticated engineering API protection
        run: |
          set -euo pipefail
          CCRO_CODE="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/addons/ccro/status)"
          COMPUTE_CODE="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/compute/capabilities)"
          case "$CCRO_CODE" in 200|401|403) ;; *) echo "Unexpected CCRO API HTTP $CCRO_CODE"; exit 1;; esac
          case "$COMPUTE_CODE" in 200|401|403) ;; *) echo "Unexpected compute API HTTP $COMPUTE_CODE"; exit 1;; esac
          if [ "$CCRO_CODE" = 200 ]; then
            curl -fsS --max-time 10 http://127.0.0.1:8000/api/addons/ccro/status | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("minimum_tier")=="entry"; assert d.get("available_all_tiers") is True'
          else
            echo "CCRO endpoint is correctly protected by authenticated Alpha access (HTTP $CCRO_CODE)."
          fi

      - name: Verify HTTPS and Bio launch route
        run: |
          set -euo pipefail
          ROOT_CODE="$(curl -ksS --max-time 10 --resolve totalwaterdesign.com:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://totalwaterdesign.com/)"
          case "$ROOT_CODE" in 200|301|302) ;; *) echo "Unexpected HTTPS root HTTP $ROOT_CODE"; exit 1;; esac
          BIO_CODE="$(curl -ksS --max-time 10 --resolve totalwaterdesign.com:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://totalwaterdesign.com/apps/bio/)"
          case "$BIO_CODE" in 200|301|302|401|403) ;; *) echo "Unexpected Bio launch HTTP $BIO_CODE"; exit 1;; esac

      - name: Publish success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d '{"state":"success","context":"twds-alpha/ccro-final","description":"Exact Alpha deployment and final Suite health checks passed"}' >/dev/null

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d '{"state":"failure","context":"twds-alpha/ccro-final","description":"Final Alpha deployment/health synchronization failed"}' >/dev/null
