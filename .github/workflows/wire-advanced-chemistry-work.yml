name: Wire Advanced Chemistry Work Branch

on:
  push:
    branches:
      - alpha
    paths:
      - .github/workflows/wire-advanced-chemistry-work.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout chemistry work branch
        uses: actions/checkout@v5
        with:
          ref: chemistry-upgrade-work
          fetch-depth: 0

      - name: Wire chemistry API and membrane transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected one match, found {n}')
              return text.replace(old,new,1)

          chem_path=Path('chemistry_analysis.py')
          chem=chem_path.read_text(encoding='utf-8')
          chem=once(chem,
              "return st, charge_report(st['composition'])",
              "return st, equilibrium_charge_report(st,temp_c)",
              'equilibrated charge report')
          chem=once(chem,
              "cr=charge_report(c); larson=(cr['rows'][0]['meq_l']*0) # placeholder overwritten below\n    meq={x['key']:x['meq_l'] for x in cr['rows']}",
              "cr=equilibrium_charge_report(carb_state,temp_c); larson=(cr['rows'][0]['meq_l']*0) # placeholder overwritten below\n    meq={x['key']:x['meq_l'] for x in cr['rows']}",
              'analysis charge report')
          chem=once(chem,
              "'free_mol_kg':free,'activities':act,'weak_systems':weak},",
              "'free_mol_kg':free,'activities':act,'weak_systems':weak,\n                          'hydroxo_species':carb_state.get('hydroxo_species',{}),\n                          'noncarbonate_alkalinity_components_mol_kg':carb_state.get('noncarbonate_alkalinity_components_mol_kg',{})},",
              'analysis hydroxo diagnostics')
          if '_legacy_weak_species_speciation = weak_species_speciation' not in chem:
              chem += '''\n\n# ---- Advanced coupled weak-species chemistry API -------------------------------\n# Preserve the established implementations as internal references, then expose\n# the advanced layer under the same public names so existing Suite callers and\n# saved projects do not need a new API.\n_legacy_weak_species_speciation = weak_species_speciation\n_legacy_solve_carbonate_state = solve_carbonate_state\n_legacy_membrane_carbonate_split = membrane_carbonate_split\n_legacy_mix_carbonate_streams = mix_carbonate_streams\n\nfrom advanced_chemistry import (\n    weak_species_speciation,\n    metal_hydroxo_speciation,\n    solve_carbonate_state,\n    solve_charge_balanced_state,\n    equilibrium_charge_report,\n    ammonia_membrane_transport,\n    membrane_carbonate_split,\n    mix_carbonate_streams,\n)\n'''
          chem_path.write_text(chem,encoding='utf-8')

          calc_path=Path('calculations.py')
          calc=calc_path.read_text(encoding='utf-8')
          calc=once(calc,
              'from chemistry_analysis import solve_carbonate_state, analytical_alkalinity_mol_kg, membrane_carbonate_split, mix_carbonate_streams, acid_dose_to_target_ph',
              'from chemistry_analysis import (solve_carbonate_state, solve_charge_balanced_state, analytical_alkalinity_mol_kg, membrane_carbonate_split, mix_carbonate_streams, acid_dose_to_target_ph, ammonia_membrane_transport)',
              'advanced chemistry imports')
          calc=once(calc,
              '                   feed_carbonate_state=None, resolve_carbonate_streams=True,\n                   membrane_recipe=None):',
              '                   feed_carbonate_state=None, resolve_carbonate_streams=True,\n                   membrane_recipe=None, neutral_ammonia_rejection_pct=0.0):',
              'membrane-stage ammonia setting')

          old='''        cp = cin * (1.0-r_test_local)\n        if full and is_nf:\n            cp_comp = nf_permeate_composition(comp_in, float(m.get("test_flux_lmh", 30.0)),\n                                               tr["nf_b_mm"], tr["nf_b_dd"], tr.get("nf_b_mix"), tr.get("nf_b_neutral"))\n            cp = total_tds_mg_l(cp_comp)\n        else:\n            cp_comp = permeate_composition(comp_in, r_test_local, rb_test_local) if full else None\n        last_qp = None\n        element_relax = 0.45\n        previous_raw_residual = None\n        previous_q_residual = None\n'''
          new='''        cp = cin * (1.0-r_test_local)\n        neutral_nh3_raw=m.get("neutral_ammonia_rejection_pct",neutral_ammonia_rejection_pct)\n        neutral_nh3_rej=float(neutral_nh3_raw or 0.0)\n        if neutral_nh3_rej>1.0:\n            neutral_nh3_rej/=100.0\n        neutral_nh3_rej=min(max(neutral_nh3_rej,0.0),0.999999999)\n        if full and is_nf:\n            initial_flux=float(m.get("test_flux_lmh", 30.0))\n            initial_nf=nf_dynamic_rejections(initial_flux,tr["nf_b_mm"],tr["nf_b_dd"],tr.get("nf_b_mix"),tr.get("nf_b_neutral"))\n            cp_comp = nf_permeate_composition(comp_in, initial_flux,\n                                               tr["nf_b_mm"], tr["nf_b_dd"], tr.get("nf_b_mix"), tr.get("nf_b_neutral"))\n            amm0=ammonia_membrane_transport(comp_in,temperature_c,float((carbonate_state_current or {}).get("ph",feed_ph)),\n                                             initial_nf["mono_mono"],initial_nf["neutral"])\n            cp_comp["ammonium"]=amm0["permeate_total_ammonia_mg_l_as_nh4"]\n            cp = total_tds_mg_l(cp_comp)\n        else:\n            cp_comp = permeate_composition(comp_in, r_test_local, rb_test_local) if full else None\n            if full:\n                amm0=ammonia_membrane_transport(comp_in,temperature_c,float((carbonate_state_current or {}).get("ph",feed_ph)),\n                                                 r_test_local,neutral_nh3_rej)\n                cp_comp["ammonium"]=amm0["permeate_total_ammonia_mg_l_as_nh4"]\n                cp=total_tds_mg_l(cp_comp)\n        last_qp = None\n        element_relax = 0.45\n        previous_raw_residual = None\n        previous_q_residual = None\n        ammonia_transport_current = None\n'''
          calc=once(calc,old,new,'initial NH3 transport')

          old='''            nf_rej_local = None\n            if full:\n                if is_nf:\n                    nf_rej_local = nf_dynamic_rejections(flux, tr["nf_b_mm"], tr["nf_b_dd"], tr.get("nf_b_mix"), tr.get("nf_b_neutral"))\n                    cp_new_comp = nf_permeate_composition(cm_comp, flux, tr["nf_b_mm"], tr["nf_b_dd"], tr.get("nf_b_mix"), tr.get("nf_b_neutral"))\n                    cp_new = total_tds_mg_l(cp_new_comp)\n                    rej = min(max(1.0-cp_new/max(total_tds_mg_l(cm_comp),1e-12),0.0),0.999999999)\n                else:\n                    cp_new_comp = permeate_composition(cm_comp, rej, boron_dynamic_rejection(rej, r_test_local, rb_test_local))\n                    cp_new = total_tds_mg_l(cp_new_comp)\n            else:\n                cp_new = max(0.0, cm_tds * (1.0 - rej))\n                cp_new_comp = None\n'''
          new='''            nf_rej_local = None\n            if full:\n                if is_nf:\n                    nf_rej_local = nf_dynamic_rejections(flux, tr["nf_b_mm"], tr["nf_b_dd"], tr.get("nf_b_mix"), tr.get("nf_b_neutral"))\n                    cp_new_comp = nf_permeate_composition(cm_comp, flux, tr["nf_b_mm"], tr["nf_b_dd"], tr.get("nf_b_mix"), tr.get("nf_b_neutral"))\n                    cp_ionic = total_tds_mg_l(cp_new_comp)\n                    rej = min(max(1.0-cp_ionic/max(total_tds_mg_l(cm_comp),1e-12),0.0),0.999999999)\n                    ammonia_ionic_rej=nf_rej_local["mono_mono"]\n                    ammonia_neutral_rej=nf_rej_local["neutral"]\n                else:\n                    cp_new_comp = permeate_composition(cm_comp, rej, boron_dynamic_rejection(rej, r_test_local, rb_test_local))\n                    ammonia_ionic_rej=rej\n                    ammonia_neutral_rej=neutral_nh3_rej\n                surface_ph_predictor=float((carbonate_state_current or {}).get("ph",feed_ph))\n                ammonia_transport_current=ammonia_membrane_transport(cm_comp,temperature_c,surface_ph_predictor,\n                                                                     ammonia_ionic_rej,ammonia_neutral_rej)\n                cp_new_comp["ammonium"]=ammonia_transport_current["permeate_total_ammonia_mg_l_as_nh4"]\n                cp_new = total_tds_mg_l(cp_new_comp)\n            else:\n                cp_new = max(0.0, cm_tds * (1.0 - rej))\n                cp_new_comp = None\n'''
          calc=once(calc,old,new,'iterative NH3 transport')

          old='''            comp_out = concentrate_composition(comp_in, qin, cp_comp, qp)\n            cavg_comp = {k:0.5*(comp_in[k]+comp_out[k]) for k in SPECIES}\n            cm_comp = (nf_polarization_scale_composition(cavg_comp,pf,pf_divalent)\n                       if is_nf else polarization_scale_composition(cavg_comp,pf,pf_divalent))\n            osm_m = osm_state_comp(cm_comp); osm_p = osm_state_comp(cp_comp)\n            csplit = None\n            if resolve_carbonate_streams:\n                carbonate_rej = (nf_rej_local or {}).get('mono_mono', rej) if is_nf else rej\n                csplit=membrane_carbonate_split(comp_in,temperature_c,carbonate_state_current,yi,carbonate_rej,cp_comp,comp_out)\n'''
          new='''            comp_out = concentrate_composition(comp_in, qin, cp_comp, qp)\n            cavg_comp = {k:0.5*(comp_in[k]+comp_out[k]) for k in SPECIES}\n            cm_comp = (nf_polarization_scale_composition(cavg_comp,pf,pf_divalent)\n                       if is_nf else polarization_scale_composition(cavg_comp,pf,pf_divalent))\n            membrane_surface_state=None\n            surface_ph_final=float((carbonate_state_current or {}).get("ph",feed_ph))\n            if resolve_carbonate_streams and element_feed_state is not None:\n                try:\n                    avg_flow=max(0.5*(qin+qout),1e-12)\n                    hydraulic_cf=qin/avg_flow\n                    cp_cf=total_tds_mg_l(cm_comp)/max(total_tds_mg_l(cavg_comp),1e-12)\n                    surface_ct=float(element_feed_state.get("total_inorganic_carbon_mol_kg",0.0))*hydraulic_cf*cp_cf\n                    membrane_surface_state=solve_charge_balanced_state(cm_comp,temperature_c,surface_ct)\n                    surface_ph_final=float(membrane_surface_state["ph"])\n                except (KeyError,ValueError,ZeroDivisionError,OverflowError):\n                    membrane_surface_state=None\n            if is_nf:\n                final_nf=nf_dynamic_rejections(max(qp*1000.0/area_each,0.0),tr["nf_b_mm"],tr["nf_b_dd"],tr.get("nf_b_mix"),tr.get("nf_b_neutral"))\n                ammonia_ionic_rej=final_nf["mono_mono"]\n                ammonia_neutral_rej=final_nf["neutral"]\n            else:\n                ammonia_ionic_rej=rej\n                ammonia_neutral_rej=neutral_nh3_rej\n            ammonia_transport_current=ammonia_membrane_transport(cm_comp,temperature_c,surface_ph_final,\n                                                                 ammonia_ionic_rej,ammonia_neutral_rej)\n            cp_comp=dict(cp_comp)\n            cp_comp["ammonium"]=ammonia_transport_current["permeate_total_ammonia_mg_l_as_nh4"]\n            comp_out = concentrate_composition(comp_in, qin, cp_comp, qp)\n            cavg_comp = {k:0.5*(comp_in[k]+comp_out[k]) for k in SPECIES}\n            cm_comp = (nf_polarization_scale_composition(cavg_comp,pf,pf_divalent)\n                       if is_nf else polarization_scale_composition(cavg_comp,pf,pf_divalent))\n            osm_m = osm_state_comp(cm_comp); osm_p = osm_state_comp(cp_comp)\n            csplit = None\n            if resolve_carbonate_streams:\n                carbonate_rej = (nf_rej_local or {}).get('mono_mono', rej) if is_nf else rej\n                csplit=membrane_carbonate_split(comp_in,temperature_c,carbonate_state_current,yi,carbonate_rej,cp_comp,comp_out)\n'''
          calc=once(calc,old,new,'final membrane-surface chemistry correction')

          calc=once(calc,
              '                "cumulative_permeate_out_flow_m3h": cumulative_out_flow,\n                "cumulative_permeate_out_composition_mg_l": cumulative_out_comp,\n            })',
              '                "cumulative_permeate_out_flow_m3h": cumulative_out_flow,\n                "cumulative_permeate_out_composition_mg_l": cumulative_out_comp,\n                "membrane_surface_ph": surface_ph_final,\n                "membrane_surface_charge_state": (membrane_surface_state.get("charge_balance") if membrane_surface_state else None),\n                "ammonia_transport": dict(ammonia_transport_current or {}),\n            })',
              'element chemistry diagnostics')

          calc=once(calc,
              '                           feed_carbonate_state=feed_carbonate_state,\n                           resolve_carbonate_streams=not _bool(data, "_solver_fast", False),\n                           membrane_recipe=recipe)',
              '                           feed_carbonate_state=feed_carbonate_state,\n                           resolve_carbonate_streams=not _bool(data, "_solver_fast", False),\n                           membrane_recipe=recipe,\n                           neutral_ammonia_rejection_pct=_float(data,"neutral_ammonia_rejection_pct",0.0) or 0.0)',
              'stage ammonia setting')

          calc_path.write_text(calc,encoding='utf-8')
          PY

      - name: Compile and smoke-test staging branch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile advanced_chemistry.py chemistry_analysis.py calculations.py water_chemistry.py solver/root_scalar.py
          python3 - <<'PY'
          import math
          import chemistry_analysis as ca
          import calculations
          from water_chemistry import SPECIES

          comp={k:0.0 for k in SPECIES}
          comp.update({'sodium':229.89769,'chloride':354.53,'calcium':40.078,'sulfate':96.06,
                       'bicarbonate':61.0168,'ammonium':18.03846})
          w8=ca.weak_species_speciation(comp,25.0,8.0)['ammonia']
          w10=ca.weak_species_speciation(comp,25.0,10.0)['ammonia']
          assert w10['neutral_fraction']>w8['neutral_fraction']>=0.0
          h8=ca.metal_hydroxo_speciation(comp,25.0,8.0)['calcium']['hydrolyzed_fraction']
          h10=ca.metal_hydroxo_speciation(comp,25.0,10.0)['calcium']['hydrolyzed_fraction']
          assert h10>h8>=0.0
          tr=ca.ammonia_membrane_transport(comp,25.0,10.0,0.99,0.0)
          assert tr['permeate_total_ammonia_mg_l_as_nh4']>comp['ammonium']*0.01
          ta=ca.analytical_alkalinity_mol_kg(comp,25.0)
          feed=ca.solve_carbonate_state(comp,25.0,ph=8.0,total_alkalinity_mol_kg=ta)
          assert abs(feed['ph']-8.0)<1e-12
          assert 'CaOH+' in {x['label'] for x in feed['hydroxo_species'].values()}
          # Verify the advanced pH root itself reaches a finite state at 1e-9 settings.
          back=ca.solve_carbonate_state(comp,25.0,total_alkalinity_mol_kg=feed['total_alkalinity_mol_kg'],
                                        total_inorganic_carbon_mol_kg=feed['total_inorganic_carbon_mol_kg'])
          assert math.isfinite(back['ph']) and abs(back['ph']-8.0)<1e-6
          print('PASS - advanced chemistry API and membrane imports')
          PY
          git diff --check

      - name: Commit staging integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Total Water Design Suite Automation"
          git config user.email "admin@totalrodesign.com"
          git add chemistry_analysis.py calculations.py advanced_chemistry.py
          git commit -m "Wire advanced weak-species chemistry into RO calculations"
          git push origin HEAD:chemistry-upgrade-work
