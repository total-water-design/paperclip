name: CCRO Alpha Health

on:
  push:
    branches:
      - alpha

permissions:
  contents: read
  statuses: write

concurrency:
  group: twds-alpha-ccro-health
  cancel-in-progress: true

jobs:
  ccro-health:
    name: Verify deployed alpha CCRO
    runs-on:
      - self-hosted
      - Linux
      - X64
      - twds-alpha
      - ec2
    timeout-minutes: 15
    steps:
      - name: Publish CCRO diagnostic pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"twds-alpha/ccro-health","description":"Inspecting deployed alpha CCRO"}' >/dev/null

      - name: Publish current live deployment marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MARKER="missing"
          if [ -f /opt/totalrodesign/app/.deployment_commit ]; then
            MARKER="$(cat /opt/totalrodesign/app/.deployment_commit)"
          fi
          SHORT_MARKER="${MARKER:0:12}"
          SHORT_EXPECTED="${GITHUB_SHA:0:12}"
          if [ "$MARKER" = "$GITHUB_SHA" ]; then
            STATE="success"
            DESC="Live marker ${SHORT_MARKER} matches alpha"
          else
            STATE="failure"
            DESC="Live marker ${SHORT_MARKER}; expected ${SHORT_EXPECTED}"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"twds-alpha/live-marker\",\"description\":\"${DESC}\"}" >/dev/null
          echo "$DESC"

      - name: Verify Total RO service
        run: systemctl is-active totalrodesign.service

      - name: Publish Total RO service status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"twds-alpha/ro-service","description":"Total RO Design service active"}' >/dev/null

      - name: Verify Bio service
        run: systemctl is-active totalbiodesign.service

      - name: Publish Bio service status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"twds-alpha/bio-service","description":"Total BioDesign service active"}' >/dev/null

      - name: Verify Suite root HTTP
        run: curl -fsS --max-time 10 http://127.0.0.1:8000/ >/dev/null

      - name: Publish Suite HTTP status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"twds-alpha/suite-http","description":"Suite root HTTP check passed"}' >/dev/null

      - name: Verify CCRO all-tier endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          CODE="$(curl -sS --max-time 10 -o "$BODY" -w '%{http_code}' http://127.0.0.1:8000/api/addons/ccro/status || true)"
          if [ "$CODE" != "200" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "{\"state\":\"failure\",\"context\":\"twds-alpha/ccro-health\",\"description\":\"CCRO endpoint HTTP ${CODE}\"}" >/dev/null
            echo "CCRO endpoint returned HTTP $CODE"
            cat "$BODY" || true
            exit 1
          fi
          if ! python3 - "$BODY" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding='utf-8'))
          assert d.get('ok') is True
          assert d.get('minimum_tier') == 'entry'
          assert d.get('available_all_tiers') is True
          PY
          then
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d '{"state":"failure","context":"twds-alpha/ccro-health","description":"CCRO endpoint JSON contract failed"}' >/dev/null
            cat "$BODY" || true
            exit 1
          fi
          cat "$BODY"

      - name: Publish CCRO health status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"twds-alpha/ccro-health","description":"CCRO endpoint confirms all-tier availability"}' >/dev/null
