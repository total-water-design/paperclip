{% extends "auth/base.html" %}
{% block title %}Reset password — Total RO Design{% endblock %}
{% block content %}
<div class="auth-heading">
  <span>ACCOUNT RECOVERY</span>
  <h2>Reset your password</h2>
  <p>Enter your email. If an active account exists, a time-limited reset link will be sent.</p>
</div>
<form method="post" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label><span>Email address</span><input type="email" name="email" required autocomplete="email" maxlength="254" autofocus></label>
  <button type="submit" class="auth-primary">Send reset link <span>→</span></button>
</form>
<div class="auth-links"><a href="{{ url_for('auth.login') }}">Back to sign in</a></div>

{% endblock %}
