{% extends "auth/base.html" %}
{% block title %}Choose a new password — Total RO Design{% endblock %}
{% block content %}
<div class="auth-heading">
  <span>ACCOUNT RECOVERY</span>
  <h2>Choose a new password</h2>
  <p>Updating the password invalidates this reset link and unlocks failed-login attempts.</p>
</div>
<form method="post" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label><span>New password</span><input type="password" name="password" required autocomplete="new-password" maxlength="256" autofocus><small>Use at least 12 characters.</small></label>
  <label><span>Confirm password</span><input type="password" name="confirm_password" required autocomplete="new-password" maxlength="256"></label>
  <button type="submit" class="auth-primary">Update password <span>→</span></button>
</form>

{% endblock %}
